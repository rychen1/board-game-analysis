services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: board_game_analysis
      POSTGRES_PASSWORD: board_game_analysis
      POSTGRES_DB: board_game_analysis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board_game_analysis"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
